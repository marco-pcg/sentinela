name: Bug report / Relato de bug
description: Report reproducible behavior in the supported CLI or workflow.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: English or Portuguese is welcome. Do not include personal images or secrets.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command, configuration and a minimal safe example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, revision, dependency versions, CPU/GPU and camera if relevant.
    validations:
      required: true
